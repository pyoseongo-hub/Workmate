<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="알바생한테 앱 깔라고 안 해도 되는 근무표. 설치 없음, 가입 없음. 링크 보내면 끝." />

    <!--
      링크 미리보기 (카카오톡·카페·인스타에 주소를 붙였을 때 뜨는 제목·설명·그림).
      이게 없으면 카톡에 회색 빈 상자만 뜬다. 홍보는 대부분 링크로 하니 중요하다.
      그림은 client/public/og.png (1200×630). 화면이 바뀌면 docs/영상/ 도구로 다시 만든다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WorkMate — 알바생한테 앱 깔라고 안 해도 되는 근무표" />
    <meta property="og:description" content="설치 없음, 가입 없음. 링크 보내면 끝. 알바생은 이름 고르고 숫자 4자리만 넣으면 됩니다." />
    <meta property="og:image" content="https://workmate-cww0.onrender.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://workmate-cww0.onrender.com/" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      글꼴은 화면을 막지 않게 나중에 받습니다.

      그냥 rel="stylesheet" 로 걸면 브라우저가 이 파일을 다 받을 때까지
      화면을 안 그립니다. 글꼴 서버가 느리거나 인터넷이 약하면 흰 화면이
      오래 보입니다(느린 곳에서는 십몇 초까지 갔습니다).

      media="print" 로 걸어 두면 "인쇄할 때만 쓰는 것" 으로 여겨 화면을
      막지 않고, 다 받은 뒤(onload) media 를 all 로 바꿔 실제로 입힙니다.
      그동안에는 기본 글꼴로 보이다가 자연스럽게 바뀝니다.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <title>WorkMate · 우리 매장</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
