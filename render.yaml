# Render 에 올릴 때 쓰는 설정입니다.
#
# 이 파일이 있으면 Render 가 "무엇을 어떻게 돌릴지" 를 알아서 읽습니다.
# 사장님은 Render 에서 이 저장소를 고르기만 하면 됩니다.
#
# 자료 창고 주소(DATABASE_URL)만 Render 화면에서 직접 넣어야 합니다.
# 비밀번호가 들어 있어 이 파일에 적어 두면 안 됩니다.

services:
  - type: web
    name: workmate
    runtime: node
    plan: free

    # 싱가포르가 한국에서 가장 가깝습니다 (무료 플랜에서 고를 수 있는 곳 중).
    region: singapore

    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm start

    # Render 가 이 주소로 서버가 살아 있는지 확인합니다.
    healthCheckPath: /api/health

    envVars:
      # 자료 창고 주소. Render 화면에서 직접 넣습니다.
      # (Neon 에서 받은 postgres://... 로 시작하는 주소)
      - key: DATABASE_URL
        sync: false

      - key: NODE_VERSION
        value: "22"
